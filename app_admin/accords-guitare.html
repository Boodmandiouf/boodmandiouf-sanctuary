<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accords guitare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
<style>
:root{--bg:#0b0b12;--card:#11121b;--card2:#171827;--tx:#e8e8f0;--mut:#8a8ca0;--red:#e11d2e;--teal:#00e5c0;--bd:#1f4a47;--dot:#00e5c0;--dotink:#04110f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f8;--card:#fff;--card2:#eef0f6;--tx:#14151f;--mut:#5d6075;--red:#c4121f;--teal:#007f6a;--bd:#9ccfc6;--dot:#14151f;--dotink:#fff}}
:root[data-theme="dark"]{--bg:#0b0b12;--card:#11121b;--card2:#171827;--tx:#e8e8f0;--mut:#8a8ca0;--red:#e11d2e;--teal:#00e5c0;--bd:#1f4a47;--dot:#00e5c0;--dotink:#04110f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Rajdhani","Segoe UI",system-ui,sans-serif}
.app{max-width:760px;margin:0 auto;padding:14px 14px 76px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;color:var(--red);font-size:1.35rem;letter-spacing:.04em;border-bottom:1px solid color-mix(in srgb,var(--red) 40%,transparent);padding-bottom:8px}
h3{margin:0;font-size:1.1rem}
.mut{color:var(--mut);margin:8px 0}
.sw{position:relative}
#q{width:100%;font:inherit;font-size:1.1rem;padding:12px 40px 12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);outline:none}
#q:focus,select:focus-visible{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 35%,transparent);outline:none}
#x{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:none;color:var(--mut);font-size:1.3rem;cursor:pointer}
.sel{display:grid;grid-template-columns:1.2fr 1.5fr .8fr;gap:8px;margin-top:10px}.sel.one{grid-template-columns:1fr;margin:0 0 4px}.sel label{min-width:0}
.sel label{display:block;font-size:.8rem;color:var(--mut)}
.sel select{width:100%;margin-top:15px;margin-bottom: 15px;font:inherit;padding:9px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx)}
#sd{font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.chip{border:1px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:999px;padding:5px 11px;font:inherit;cursor:pointer}
.chip small{opacity:.6;margin-left:4px}
.chip.on{background:var(--teal);color:var(--dotink);border-color:var(--teal);font-weight:700}
#roots{border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:4px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.nm{font-size:1.5rem;font-weight:700}.nm small{font-size:1rem;color:var(--mut);font-weight:500;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.v{position:relative;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:6px 4px 8px;text-align:center;cursor:pointer;color:var(--tx);font:inherit}
.v:hover,.v:focus-visible{border-color:var(--teal);outline:none}
.v svg{width:100%;height:auto;display:block}
.v span{display:block;font-size:.85rem;color:var(--mut)}
.v b{display:block;font-size:1.1rem}
.v i{position:absolute;top:4px;left:7px;font-style:normal;color:var(--teal)}
.v .rm{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.v.ed{border-color:var(--red)}
.btn{border:1px solid var(--red);background:none;color:var(--red);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.empty{color:var(--mut);padding:10px 0}
.note{color:var(--red);font-size:.95rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--teal)}
.bar[hidden]{display:none}
.bar button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.bar b{background:var(--teal);color:var(--dotink);border-radius:999px;min-width:26px;text-align:center;padding:1px 8px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hd select{max-width:48%;font:inherit;padding:7px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx)}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
details.card>summary{cursor:pointer;font-weight:700;font-size:1.1rem}
details.card[open]>summary{margin-bottom:10px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.pr div{min-width:0}.pr b{display:block}.pr span{display:block;font-size:.88rem;color:var(--mut)}
#tm{min-height:1.2em;margin:4px 0}
</style>
</head>
<body>
<main class="app" id="guitar-chords">
 <section class="card">
  <h2>ACCORDS GUITARE</h2>
  <div class="sw">
   <input id="q" type="search" placeholder="Do, Ré7, Mi9m, A, Em, F#m7…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Rechercher un accord">
   <button id="x" aria-label="Effacer" hidden>×</button>
  </div>
  <div class="sel">
   <label>Style<select id="st"></select></label>
   <label>Accordage<select id="tu"></select></label>
   <label>Capo<select id="cp"></select></label>
  </div>
  <p class="mut" id="sd" hidden></p>
  <div class="chips" id="roots" aria-label="Note"></div>
  <div class="chips" id="chips" aria-label="Type d’accord"></div>
  <div id="res"></div>
 </section>
 <details class="card" id="pg">
  <summary id="pgt">Progressions types</summary>
  <p class="mut">Progressions courantes, à adapter à ton oreille. Elles utilisent l’accordage et le capo choisis.</p>
  <div class="sel one"><label>Tonalité<select id="tn"></select></label></div>
  <div id="pgl"></div>
 </details>
 <section class="card" id="suite">
  <div class="hd"><h3>Ma suite d’accords</h3><button class="btn" id="empty" hidden>Vider</button></div>
  <div class="tb" id="tb" hidden><button class="chip" id="dn">− ½ ton</button><button class="chip" id="up">+ ½ ton</button><span class="mut" id="ci"></span></div>
  <p class="note" id="tm" role="status"></p>
  <div class="grid" id="prog"></div>
 </section>
</main>
<div class="bar" id="bar" hidden></div>
<script>
const FR=['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'],
FRb=['Do','Réb','Ré','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'],
EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
ENb=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],
TUN=[
 {n:'Standard — EADGBE',k:'Std',p:[4,9,2,7,11,4],s:1},
 {n:'Demi-ton plus bas — Eb',k:'Eb',p:[3,8,1,6,10,3],s:1},
 {n:'Ton plus bas — D',k:'D',p:[2,7,0,5,9,2],s:1},
 {n:'Drop D — DADGBE',k:'Drop D',p:[2,9,2,7,11,4]},
 {n:'Drop C# — C#G#C#F#A#D#',k:'Drop C#',p:[1,8,1,6,10,3]},
 {n:'Drop C — CGCFAD',k:'Drop C',p:[0,7,0,5,9,2]},
 {n:'Drop B — BF#BEG#C#',k:'Drop B',p:[11,6,11,4,8,1]},
 {n:'DADGAD',k:'DADGAD',p:[2,9,2,7,9,2],o:1},
 {n:'Open G — DGDGBD',k:'Open G',p:[2,7,2,7,11,2],o:1},
 {n:'Open D — DADF#AD',k:'Open D',p:[2,9,2,6,9,2],o:1}
],
QS=['','m','7','maj7','m7','6','9','m9','sus2','sus4','add9','5','dim','aug','m7b5','13'],
STYLES={
 triade:{g:'Bases',n:'Triades',d:'Les 3 notes de base : majeur, mineur, diminué, augmenté, sus.',q:['','m','dim','aug','sus2','sus4']},
 classique:{g:'Bases',n:'Classique',d:'Musique tonale classique : triades, septième de dominante, diminués.',q:['','m','7','6','m6','dim','dim7','aug','sus4']},
 moderne:{g:'Bases',n:'Moderne / Pop',d:'Pop actuelle : triades, sus2/sus4, add9 et maj7.',q:['','m','sus2','sus4','add9','5','maj7','m7','6']},
 rock:{g:'Rock & Métal',n:'Rock',d:'Rock : power chords (5), triades, sus et septièmes.',q:['5','','m','sus4','sus2','7','add9']},
 emo:{g:'Rock & Métal',n:'Emo / Math rock',d:'Accords aérés : add9, maj7, sus2, mineurs 9.',q:['add9','maj7','sus2','sus4','m9','9','6']},
 metal:{g:'Rock & Métal',n:'Métal',d:'Métal : power chords (5), mineurs, sus, diminués. Un accordage Drop simplifie les power chords à un doigt.',q:['5','m','sus2','sus4','dim','m7','madd9','7']},
 djent:{g:'Rock & Métal',n:'Djent / Prog',d:'Djent : power chords et mineurs étendus (add9, 9, 11), souvent en accordage grave (Drop C, Drop B).',q:['5','m','madd9','m7','m9','sus2','m11','m6','m7b5']},
 blues:{g:'Blues & Jazz',n:'Blues',d:'Blues : septièmes et neuvièmes de dominante, 13e, 7#9.',q:['7','9','13','m','m7','7#9','dim7']},
 jazz:{g:'Blues & Jazz',n:'Jazz',d:'Jazz : accords de 4 sons et plus, demi-diminués, altérés.',q:['maj7','m7','7','m7b5','dim7','9','13','6','m6','maj9','mmaj7','7b9','7#9']},
 bossa:{g:'Blues & Jazz',n:'Bossa nova',d:'Bossa nova : maj7, m7, 6, m6, 9 et diminués.',q:['maj7','m7','7','6','m6','9','m9','dim7']},
 funk:{g:'Groove',n:'Funk',d:'Funk : septièmes et neuvièmes de dominante, mineurs 7/9/11, 7sus4.',q:['7','9','13','m7','m9','m11','7sus4','11','m6']},
 soul:{g:'Groove',n:'Soul / R&B',d:'Soul / R&B : maj7, m7, 9, m9, add9, sus4, 11.',q:['maj7','m7','9','m9','add9','sus4','7','11']},
 lofi:{g:'Chill & Japon',n:'Lo-fi',d:'Lo-fi : accords « jazzy » doux (maj7, m7, maj9, m9, add9).',q:['maj7','m7','maj9','m9','9','add9','6','m6','m11']},
 japonais:{g:'Chill & Japon',n:'Japonais (city pop / J-pop)',d:'City pop / J-pop : maj7, m7, 7, 9, 7sus4, demi-diminués.',q:['maj7','m7','7','9','7sus4','sus4','add9','maj9','m7b5','6']}
},
OD={C:'x32010',C7:'x32310',Cmaj7:'x32000',Cadd9:'x32030',D:'xx0232',Dm:'xx0231',D7:'xx0212',Dmaj7:'xx0222',Dsus2:'xx0230',Dsus4:'xx0233',Dm7:'xx0211',E:'022100',Em:'022000',E7:'020100',Em7:'020000',Emaj7:'021100',Esus4:'022200',G:'320003',G7:'320001',Gmaj7:'320002',G6:'320000',A:'x02220',Am:'x02210',A7:'x02020',Am7:'x02010',Amaj7:'x02120',Asus2:'x02200',Asus4:'x02230',Aadd9:'x02420',B7:'x21202',Fmaj7:'xx3210'},
SH={e:{'':'022100',m:'022000',7:'020100',m7:'020000',maj7:'021100',sus4:'022200',m6:'022020',5:'022xxx'},
 a:{'':'x02220',m:'x02210',7:'x02020',m7:'x02010',maj7:'x02120',sus4:'x02230',sus2:'x02200',m7b5:'x0101x',dim:'x0121x',5:'x022xx'}};
const $=s=>document.querySelector(s);
let OPEN,TI=0,CAPO=0;
const setOpen=()=>{OPEN=TUN[TI].p.map(x=>(x+CAPO)%12)};setOpen();
const BASES={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11},
TE=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'],
TON=[['Do',0],['Réb',1],['Ré',2],['Mib',3],['Mi',4],['Fa',5],['Fa#',6],['Sol',7],['Lab',8],['La',9],['Sib',10],['Si',11]],
PR={
 '':[['Pop','I V vi IV'],['Cadence simple','I IV V I'],['II–V–I','ii7 V7 Imaj7']],
 triade:[['Cadence simple','I IV V I'],['Pop','I V vi IV'],['Années 50','I vi IV V'],['Pop inversé','vi IV I V']],
 classique:[['Cadence parfaite','I IV V7 I'],['Canon (Pachelbel)','I V vi iii IV I IV V'],['Mineur classique','i iv V i'],['Cadence andalouse','i bVII bVI V']],
 moderne:[['Pop','I V vi IV'],['Pop inversé','vi IV I V'],['Années 50','I vi IV V'],['Pop colorée','Iadd9 V vi7 IVmaj7']],
 rock:[['Rock mixolydien','I bVII IV'],['Rock classique','I bIII IV I'],['Power chords','I5 IV5 V5 I5'],['Rock mineur','i bVII bVI bVII']],
 emo:[['Pop colorée','Iadd9 Vsus4 vi7 IVmaj7'],['Pop colorée inversée','vi7 IVmaj7 Iadd9 Vsus4']],
 metal:[['Éolien (i–bVI–bVII)','I5 bVI5 bVII5 I5'],['Phrygien','I5 bII5 I5 bIII5'],['Triton','I5 bV5 I5 bVII5']],
 djent:[['Mineur étendu','i9 bVImaj7 bIIImaj7 bVII'],['Power chords graves','I5 bVI5 bIII5 bVII5'],['Phrygien coloré','iadd9 bII iadd9 bIII']],
 blues:[['Blues 12 mesures','I7 I7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7'],['Blues mineur 12 mesures','i7 i7 i7 i7 iv7 iv7 i7 i7 bVI7 V7 i7 i7']],
 jazz:[['II–V–I majeur','ii7 V7 Imaj7'],['II–V–I mineur','iim7b5 V7b9 i'],['Turnaround','Imaj7 vi7 ii7 V7']],
 bossa:[['II–V–I–VI','ii7 V7 Imaj7 vi7'],['Passage diminué','Imaj7 #idim7 ii7 V7']],
 funk:[['Vamp dominante','I9 IV9'],['Vamp dorien','i7 IV7'],['Vamp mineur','i9 iv7']],
 soul:[['I–vi–ii–V','Imaj7 vi7 ii7 V7'],['IV–iii–ii–I','IVmaj7 iii7 ii7 Imaj7']],
 lofi:[['II–V–I–VI','ii7 V7 Imaj7 vi7'],['I–iii–vi–ii','Imaj7 iii7 vi7 ii7']],
 japonais:[['Royal road (王道進行)','IVmaj7 V7 iii7 vi7'],['Marunouchi (丸サ進行)','IVmaj7 III7 vi7 v7 I7'],['Komuro (小室進行)','vi IV V I']]
};

function note(t){
 const m=t.match(/^(do|r[eé]|mi|fa|sol|la|si|[a-g])/i);if(!m)return null;
 let len=m[0].length,acc=0;
 const a=t.slice(len).match(/^(bémol|bemol|dièse|diese|#|♯|♭|b)/i);
 if(a){const x=a[1].toLowerCase();acc=(x==='b'||x==='♭'||x.startsWith('bé')||x==='bemol')?-1:1;len+=a[1].length}
 return{pc:(BASES[m[1].toLowerCase().replace('é','e')]+acc+12)%12,flat:acc<0,len};
}

function parse(inp){
 const t=inp.trim().replace(/\s+/g,'');if(!t)return null;
 const parts=t.split('/'),n=note(parts[0]);if(!n||parts.length>2)return null;
 let bn=null;if(parts[1]){bn=note(parts[1]);if(!bn||bn.len!==parts[1].length)return null}
 let maj=0,dim=0,aug=0,sus='',add='',alt='',a9='';
 let r=parts[0].slice(n.len).replace(/maj/ig,'§').replace(/M/g,'§').toLowerCase()
  .replace(/§/g,()=>{maj=1;return''})
  .replace(/dim|°/g,()=>{dim=1;return''})
  .replace(/aug|\+/g,()=>{aug=1;return''})
  .replace(/sus(2|4)?/g,(x,d)=>{sus=d||'4';return''})
  .replace(/add(\d+)/g,(x,d)=>{add=d;return''})
  .replace(/[b#]9/g,x=>{a9=x;return''})
  .replace(/[b#]5/g,x=>{alt=x;return''});
 const nm=r.match(/13|11|9|7|6|5/),num=nm?nm[0]:'';if(num)r=r.replace(num,'');
 const minor=/[m-]/.test(r);r=r.replace(/[m-]/g,'');if(r)return null;
 const third=sus==='2'?2:sus?5:(dim||minor?3:4);
 let fifth=dim?6:aug?8:7;if(alt==='b5')fifth=6;if(alt==='#5')fifth=8;
 let iv=[0,third,fifth];const power=num==='5'&&!sus&&!dim&&!aug;if(power)iv=[0,7];
 const sev=(dim&&num==='7')?9:maj?11:10;
 if(num==='6')iv.push(9);
 if(['7','9','11','13'].includes(num))iv.push(sev);
 if(['9','11','13'].includes(num))iv.push(2);
 if(num==='11')iv.push(5);if(num==='13')iv.push(9);
 if(add){const x={9:2,2:2,11:5,4:5,13:9}[add];if(x!=null)iv.push(x)}
 if(a9==='b9')iv.push(1);if(a9==='#9')iv.push(3);
 const root=n.pc,flat=n.flat,bass=bn?bn.pc:null;
 const S=new Set(iv.map(x=>(x+root)%12));if(bass!==null)S.add(bass);
 const pcs=[...S],req=new Set(pcs),drop=x=>{if(x!==bass)req.delete(x)};
 if(iv.length>3&&!power)drop((fifth+root)%12);
 if(num==='11'||num==='13')drop((2+root)%12);
 const sfx=(dim?'dim':aug?'aug':minor?'m':'')+(num?(maj?'maj':'')+num:'')+(sus?'sus'+sus:'')+(add?'add'+add:'')+alt+a9;
 const rf=(flat?FRb:FR)[root],re=(flat?ENb:EN)[root];
 const bf=bn?'/'+(bn.flat?FRb:FR)[bass]:'',be=bn?'/'+(bn.flat?ENb:EN)[bass]:'';
 return{root,flat,sfx,pcs,req,rf,bass,fr:rf+(sfx?' '+sfx:'')+bf,en:re+sfx+be,min:power?3:4};
}

function roman(tok,tonic){
 const m=tok.match(/^([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(.*)$/);if(!m)return null;
 const up=m[2]===m[2].toUpperCase(),deg={i:0,ii:2,iii:4,iv:5,v:7,vi:9,vii:11}[m[2].toLowerCase()];
 const pc=(tonic+deg+(m[1]==='b'?-1:m[1]==='#'?1:0)+12)%12;
 const sfx=up?m[3]:((/^(dim|m7b5)/.test(m[3])?'':'m')+m[3]);
 return((m[1]==='b'||[1,3,5,8,10].includes(tonic))?FRb:FR)[pc]+sfx;
}

function stdSet(p){
 const S=new Set();if(!TUN[TI].s||p.bass!==null)return S;
 const sh=(OPEN[0]-4+12)%12,cv=s=>[...s].map(c=>c==='x'?-1:+c);
 const od=OD[EN[(p.root-sh+12)%12]+p.sfx];if(od)S.add(cv(od).join(','));
 [['e',0],['a',1]].forEach(([k,i])=>{const sp=SH[k][p.sfx];if(!sp)return;const r=(p.root-OPEN[i]+12)%12;S.add(cv(sp).map(f=>f<0?-1:f+r).join(','))});
 return S;
}

const cache={};
function voicings(p){
 const key=TI+'|'+CAPO+'|'+p.root+'|'+p.sfx+'|'+p.bass;if(cache[key])return cache[key];
 const set=new Set(p.pcs),out=new Map(),std=stdSet(p),bp=p.bass!==null?p.bass:p.root;
 for(let b=0;b<=12;b++){
  const lo=b===0?1:b,opts=[];
  for(let s=0;s<6;s++){const o=[-1];if(b===0&&set.has(OPEN[s]))o.push(0);
   for(let f=lo;f<lo+4;f++)if(set.has((OPEN[s]+f)%12))o.push(f);opts.push(o)}
  const c=[];
  (function rec(s){
   if(s<6){for(const f of opts[s]){c[s]=f;rec(s+1)}return}
   const pl=c.map((f,i)=>f>=0?i:-1).filter(i=>i>=0);if(!pl.length)return;
   const a=pl[0],z=pl[pl.length-1];if(z-a+1!==pl.length||pl.length<p.min)return;
   const bassOk=(OPEN[a]+c[a])%12===bp;if(!bassOk&&(p.bass!==null||!TUN[TI].o))return;
   const got=new Set(pl.map(i=>(OPEN[i]+c[i])%12));
   for(const x of p.req)if(!got.has(x))return;
   const fr=pl.filter(i=>c[i]>0),opens=pl.length-fr.length;
   if(b===0&&!opens)return;
   if(p.min===3&&opens&&c[a]!==0)return;
   if(b>0&&Math.min(...fr.map(i=>c[i]))!==b)return;
   let fingers=fr.length,barre=null;
   if(fr.length){const mn=Math.min(...fr.map(i=>c[i])),bs=fr.filter(i=>c[i]===mn);
    if(bs.length>=2&&bs[bs.length-1]-bs[0]>=2){let ok=true;for(let i=bs[0];i<=bs[bs.length-1];i++)if(c[i]<mn)ok=false;
     if(ok){barre={f:mn,a:bs[0],b:bs[bs.length-1]};fingers=1+fr.filter(i=>c[i]>mn).length}}}
   if(fingers>4)return;
   const k=c.join(','),isStd=std.has(k);
   if(!out.has(k))out.set(k,{f:[...c],barre,std:isStd,score:b*2.5+fingers*1.2-(p.min===3?(pl.length===3?3:1.5):pl.length*1.3)-opens*.6+(barre&&p.min!==3?1:0)-(isStd?12:0)+(bassOk?0:1.5),pos:fr.length?Math.min(...fr.map(i=>c[i])):0});
  })(0);
 }
 const kept=[];
 for(const v of [...out.values()].sort((x,y)=>x.score-y.score)){
  if(p.min!==3&&kept.some(k=>v.f.every((f,i)=>f<0||f===k.f[i])))continue;
  kept.push(v);if(kept.length===8)break;
 }
 return cache[key]=kept;
}
function vFor(p,t){const a=TI;TI=t;setOpen();const r=voicings(p);TI=a;setOpen();return r}

function fing(v){
 const f=v.f,out=[0,0,0,0,0,0],idx=[];f.forEach((x,i)=>{if(x>0)idx.push(i)});
 if(!idx.length)return out;
 const mn=Math.min(...idx.map(i=>f[i])),hb=!!v.barre,sh=(!hb&&f.includes(0)&&mn>=2)?1:0;
 let n=hb?1:0;
 if(hb)idx.forEach(i=>{if(f[i]===v.barre.f&&i>=v.barre.a&&i<=v.barre.b)out[i]=1});
 idx.filter(i=>!out[i]).sort((a,b)=>f[a]-f[b]||a-b).forEach(i=>{n=Math.max(n+1,f[i]-mn+1+sh);out[i]=Math.min(n,4)});
 return out;
}

function svg(v){
 const pl=v.f.filter(x=>x>0),mx=Math.max(0,...pl),mn=pl.length?Math.min(...pl):1,base=mx>4?mn:1,fg=fing(v);
 const X=i=>18+i*13,Y=r=>28+r*20,cy=f=>Y(f-base)+10;
 const tx=(x,y,t)=>`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--dotink)" stroke="none">${t}</text>`;
 let s='<svg viewBox="0 0 100 114" aria-hidden="true" stroke="currentColor" fill="none">';
 for(let r=0;r<=4;r++)s+=`<line x1="${X(0)}" x2="${X(5)}" y1="${Y(r)}" y2="${Y(r)}" stroke-width="${r===0&&base===1?3:1}" opacity="${r===0&&base===1?1:.45}"/>`;
 for(let i=0;i<6;i++)s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(4)}" stroke-width="1" opacity=".7"/>`;
 v.f.forEach((f,i)=>{
  if(f<0)s+=`<path d="M${X(i)-3.5} 11l7 7m0-7l-7 7" stroke-width="1.6"/>`;
  else if(f===0)s+=`<circle cx="${X(i)}" cy="14.5" r="3.6" stroke-width="1.4"/>`;
  else if(!(v.barre&&f===v.barre.f&&i>=v.barre.a&&i<=v.barre.b))s+=`<circle cx="${X(i)}" cy="${cy(f)}" r="5.2" fill="var(--dot)" stroke="none"/>`+(fg[i]?tx(X(i),cy(f),fg[i]):'');
 });
 if(v.barre)s+=`<rect x="${X(v.barre.a)-5.2}" y="${cy(v.barre.f)-5.2}" width="${X(v.barre.b)-X(v.barre.a)+10.4}" height="10.4" rx="5.2" fill="var(--dot)" stroke="none"/>`+tx(X(v.barre.a),cy(v.barre.f),1);
 if(base>1)s+=`<text x="2" y="${cy(base)+4}" font-size="11" fill="currentColor" stroke="none" opacity=".8">${base}</text>`;
 return s+'</svg>';
}

let prog=[],cur=null,edit=-1,style='',suiteVis=false,ft;
try{prog=JSON.parse(localStorage.getItem('gc_prog')||'[]');CAPO=+localStorage.getItem('gc_capo')||0;setOpen()}catch(e){}
const save=()=>{try{localStorage.setItem('gc_prog',JSON.stringify(prog));localStorage.setItem('gc_capo',CAPO)}catch(e){}};
function flash(m){const e=$('#tm');e.textContent=m;clearTimeout(ft);ft=setTimeout(()=>{e.textContent=''},6000)}
const item=(p,v,t)=>({fr:p.fr,en:p.en,f:v.f,barre:v.barre,t:t});

function showSearch(){
 const val=$('#q').value,S=STYLES[style];cur=parse(val);$('#x').hidden=!val;
 $('#sd').hidden=!S;if(S)$('#sd').textContent=S.d+' (repère courant, pas une règle)';
 $('#roots').innerHTML=FR.map((n,i)=>`<button class="chip${cur&&cur.root===i?' on':''}" data-r="${i}">${n}<small>${EN[i]}</small></button>`).join('');
 const chips=$('#chips'),res=$('#res');
 showPg();
 if(!cur){chips.innerHTML='';res.innerHTML=val.trim()?'<p class="note">Accord non reconnu. Exemples : Do, Ré7, Mi9m, A, Em, F#m7, Do/Sol.</p>':'<p class="empty">Choisis une note ou tape un accord pour voir ses positions.</p>';return}
 chips.innerHTML=(S?S.q:QS).map(q=>`<button class="chip${q===cur.sfx?' on':''}" data-q="${q}">${cur.rf}${q?' '+q:''}</button>`).join('');
 const vs=voicings(cur),tones=cur.pcs.filter(x=>x!==cur.root),nf=x=>(cur.flat?FRb:FR)[x];
 res.innerHTML=`<div class="hd"><div class="nm">${cur.fr}<small>${cur.en}</small></div>${tones.length?`<select id="bs" aria-label="Basse"><option value="">Basse : fondamentale</option>${tones.map(x=>`<option value="${x}"${x===cur.bass?' selected':''}>Basse : ${nf(x)}</option>`).join('')}</select>`:''}</div>`+
  (CAPO?`<p class="mut">Capo case ${CAPO} : les cases sont comptées à partir du capo.</p>`:'')+
  (edit>=0?`<p class="note">Choisis la position qui remplacera l’accord n°${edit+1} de ta suite.</p>`:'')+
  (vs.length?`<div class="grid">${vs.map((v,i)=>`<button class="v" data-i="${i}" aria-label="Ajouter ${cur.fr}, position ${i+1}">${v.std?'<i title="Forme classique">★</i>':''}${svg(v)}<b>${v.pos?'Case '+v.pos:'Position ouverte'}</b><span>${edit>=0?'Remplacer':'Ajouter'}</span></button>`).join('')}</div>${vs.some(v=>v.std)?'<p class="mut">★ forme classique. Les chiffres indiquent les doigts proposés (1 = index).</p>':'<p class="mut">Les chiffres indiquent les doigts proposés (1 = index).</p>'}`:'<p class="empty">Aucune position trouvée pour cet accord dans cet accordage.</p>');
}

function showPg(){
 const S=STYLES[style],list=PR[style]||PR[''],tn=+$('#tn').value;
 $('#pgt').textContent='Progressions types'+(S?' ('+S.n+')':'');
 $('#pgl').innerHTML=list.map((p,i)=>{const t=p[1].split(' ');return`<div class="pr"><div><b>${p[0]}</b><span>${t.join(' – ')}</span><span>${t.map(x=>roman(x,tn)).join(' – ')}</span></div><button class="btn" data-p="${i}">Ajouter</button></div>`}).join('');
}

function showProg(){
 $('#empty').hidden=!prog.length;$('#tb').hidden=!prog.length;
 $('#ci').textContent=CAPO?'Capo case '+CAPO:'';
 $('#prog').innerHTML=prog.length?prog.map((c,i)=>`<div class="v${i===edit?' ed':''}" data-e="${i}" tabindex="0" role="button" aria-label="Modifier ${c.fr}">${svg(c)}<b>${c.fr}</b><span>${c.en}${c.t?' ('+TUN[c.t].k+')':''}</span><button class="rm" data-d="${i}" aria-label="Retirer ${c.fr}">×</button></div>`).join(''):'<p class="empty">Ajoute des accords depuis les résultats ou les progressions : ils s’afficheront ici, dans l’ordre.</p>';
 showBar();
}
function showBar(){
 const b=$('#bar');b.hidden=!prog.length||suiteVis;
 b.innerHTML=`<button aria-label="Voir ma suite d’accords"><b>${prog.length}</b><span>${prog.map(c=>c.fr).join(', ')}</span>↓</button>`;
}

function revoice(fn,msg){
 const miss=[];
 prog=prog.map(it=>{const p=parse(fn(it)),vs=p?vFor(p,it.t||0):[];if(!vs.length){miss.push(it.fr);return it}return item(p,vs[0],it.t||0)});
 save();showProg();showSearch();
 flash(miss.length?'Aucune position pour : '+miss.join(', ')+' (accord laissé tel quel).':msg);
}
function shift(it,n){const p=parse(it.en),L=n<0?ENb:EN;return L[(p.root+n+12)%12]+p.sfx+(p.bass!==null?'/'+L[(p.bass+n+12)%12]:'')}

(function(){
 const g={};for(const[k,s]of Object.entries(STYLES)){(g[s.g]=g[s.g]||[]).push(`<option value="${k}">${s.n}</option>`)}
 $('#st').innerHTML='<option value="">Tous les styles</option>'+Object.entries(g).map(([n,o])=>`<optgroup label="${n}">${o.join('')}</optgroup>`).join('');
 $('#tu').innerHTML=TUN.map((t,i)=>`<option value="${i}">${t.n}</option>`).join('');
 $('#cp').innerHTML='<option value="0">Aucun</option>'+[1,2,3,4,5,6,7,8,9].map(i=>`<option value="${i}">${i}</option>`).join('');$('#cp').value=CAPO;
 $('#tn').innerHTML=TON.map(([n,pc])=>`<option value="${pc}">${n} (${TE[pc]})</option>`).join('');
})();
$('#st').onchange=e=>{style=e.target.value;showSearch()};
$('#tu').onchange=e=>{TI=+e.target.value;setOpen();showSearch()};
$('#cp').onchange=e=>{CAPO=+e.target.value;setOpen();revoice(it=>it.en,CAPO?'Suite recalculée pour un capo case '+CAPO+'.':'Suite recalculée sans capo.')};
$('#tn').onchange=showPg;
$('#dn').onclick=()=>revoice(it=>shift(it,-1),'Suite transposée de − ½ ton (position la plus classique choisie).');
$('#up').onclick=()=>revoice(it=>shift(it,1),'Suite transposée de + ½ ton (position la plus classique choisie).');
$('#q').addEventListener('input',()=>{edit=-1;showProg();showSearch()});
$('#x').onclick=()=>{$('#q').value='';edit=-1;showProg();showSearch();$('#q').focus()};
$('#roots').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
 $('#q').value=FR[+b.dataset.r]+(cur?cur.sfx:(STYLES[style]?STYLES[style].q[0]:''));showSearch()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b||!cur)return;$('#q').value=cur.rf+b.dataset.q;showSearch()};
$('#res').onchange=e=>{if(e.target.id!=='bs'||!cur)return;const v=e.target.value;
 $('#q').value=cur.rf+cur.sfx+(v===''?'':'/'+(cur.flat?FRb:FR)[+v]);showSearch()};
$('#res').onclick=e=>{
 const b=e.target.closest('.v');if(!b||!cur)return;
 const it=item(cur,voicings(cur)[+b.dataset.i],TI);
 if(edit>=0){prog[edit]=it;edit=-1}else prog.push(it);
 save();showProg();showSearch();
};
$('#pgl').onclick=e=>{
 const b=e.target.closest('[data-p]');if(!b)return;
 const tn=+$('#tn').value,miss=[],added=[];
 (PR[style]||PR['']) [+b.dataset.p][1].split(' ').forEach(t=>{
  const p=parse(roman(t,tn)||''),v=p&&voicings(p)[0];
  if(!v){miss.push(t);return}prog.push(item(p,v,TI));added.push(p.fr)});
 save();showProg();showSearch();
 flash(miss.length?'Aucune position pour : '+miss.join(', ')+'.':'Ajouté à ta suite : '+added.join(', ')+'.');
};
$('#prog').onclick=e=>{
 const d=e.target.closest('[data-d]');
 if(d){prog.splice(+d.dataset.d,1);edit=-1;save();showProg();showSearch();return}
 const c=e.target.closest('[data-e]');if(!c)return;
 edit=+c.dataset.e;TI=prog[edit].t||0;setOpen();$('#tu').value=TI;$('#q').value=prog[edit].en;
 showProg();showSearch();$('#q').scrollIntoView({behavior:'smooth',block:'start'});
};
$('#prog').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.e!==undefined){e.preventDefault();e.target.click()}};
$('#empty').onclick=()=>{prog=[];edit=-1;save();showProg();showSearch()};
$('#bar').onclick=()=>$('#suite').scrollIntoView({behavior:'smooth',block:'start'});
if('IntersectionObserver' in window)new IntersectionObserver(([e])=>{suiteVis=e.isIntersecting;showBar()}).observe($('#suite'));
showProg();showSearch();
</script>
</body>
